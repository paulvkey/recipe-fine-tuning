### model
model_name_or_path: Qwen/Qwen3-8B-Base
trust_remote_code: true
# train.sh 会在 H100 服务器上自动优先覆盖为 fa2；未安装 flash-attn 时使用 sdpa。
flash_attn: auto
# H100 90GB 训练 8B LoRA 时默认关闭梯度检查点，以换取更高吞吐。
disable_gradient_checkpointing: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target: all
loraplus_lr_ratio: 16.0
# rank 32 + LoRA+ 已有足够容量；默认关闭 DoRA，保持 vLLM 直接加载能力。
use_dora: false
include_effective_tokens_per_second: true

### dataset
dataset: recipe_sft_100k
dataset_dir: data
template: qwen3_nothink
cutoff_len: 2048
max_samples: 100000
overwrite_cache: false
preprocessing_num_workers: 16
dataloader_num_workers: 4
val_size: 0.1
train_on_prompt: false
packing: false

### output
output_dir: outputs/qwen3-8b-base/recipe-lora-sft
logging_steps: 10
save_strategy: steps
save_steps: 1000
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 1000
max_grad_norm: 1.0
bf16: true
fp16: false
seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
eval_strategy: epoch
